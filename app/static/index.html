<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComfyUI 离线生图</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>🎨 ComfyUI 离线生图</h1>
      <div class="status-line">
        <span id="comfy-status" class="status-pill unknown">
          <span class="dot"></span><span id="comfy-status-text">检测中…</span>
        </span>
        <span id="queue-info" class="queue-info">队列：-</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="panel form-panel">
      <form id="gen-form" autocomplete="off">
        <div class="field">
          <label for="workflow-select">工作流</label>
          <select id="workflow-select"></select>
        </div>

        <div class="field">
          <div class="field-head">
            <label for="prompt">提示词</label>
            <span class="hint"><a href="/download/image-prompt-skill.md" download>📄 提示词指南</a></span>
          </div>
          <textarea id="prompt" rows="5" maxlength="8000" placeholder="描述你想生成的画面…（使用 layout JSON 时留空）"></textarea>
          <div class="counter"><span id="prompt-count">0</span>/8000</div>
        </div>

        <details class="advanced" id="advanced-panel">
          <summary>高级选项</summary>
          <div class="advanced-body">
            <div class="field">
              <label for="negative">负面提示词</label>
              <textarea id="negative" rows="2" maxlength="8000" placeholder="不想要的内容（可选）"></textarea>
            </div>

            <div class="grid-3">
              <div class="field">
                <label for="steps">步数 (3–70)</label>
                <input type="number" id="steps" min="3" max="70" value="50">
              </div>
              <div class="field">
                <label for="seed">种子</label>
                <input type="number" id="seed" min="0" placeholder="随机">
              </div>
              <div class="field">
                <label for="size-preset">分辨率</label>
                <select id="size-preset">
                  <option value="512">512 × 512</option>
                  <option value="768">768 × 768</option>
                  <option value="1024" selected>1024 × 1024</option>
                  <option value="custom">自定义…</option>
                </select>
              </div>
            </div>
            <div class="grid-2" id="custom-size" hidden>
              <div class="field">
                <label for="width">宽度</label>
                <input type="number" id="width" min="16" max="1920" step="16" value="1024">
              </div>
              <div class="field">
                <label for="height">高度</label>
                <input type="number" id="height" min="16" max="1920" step="16" value="1024">
              </div>
            </div>

            <div class="field">
              <div class="field-head">
                <label for="lora-file">LoRA 文件名</label>
                <span class="hint" id="lora-hint"></span>
              </div>
              <input type="text" id="lora-file" maxlength="300" placeholder="留空使用工作流默认 LoRA">
            </div>
            <div class="grid-2">
              <div class="field">
                <label for="lora-strength">LoRA 强度 (0–2)</label>
                <input type="number" id="lora-strength" min="0" max="2" step="0.01" value="1">
              </div>
              <div class="field check-field">
                <label class="checkbox-label">
                  <input type="checkbox" id="disable-lora"> 本次禁用 LoRA
                </label>
              </div>
            </div>

            <details class="advanced" id="layout-details">
              <summary>layout JSON（MOSS-Image 专家模式）</summary>
              <div class="field">
                <textarea id="layout" rows="8" placeholder='填写 layout JSON 时请清空正向提示词，例如：
{"summary": {"caption": "..."}, "items": [...]}'></textarea>
              </div>
            </details>
          </div>
        </details>

        <button type="submit" id="submit-btn" class="primary-btn">开始生成</button>
        <div id="form-error" class="form-error" hidden></div>
      </form>
    </section>

    <section class="panel history-panel">
      <div class="panel-head">
        <h2>历史任务</h2>
        <button id="refresh-btn" class="ghost-btn" type="button">刷新</button>
      </div>
      <div id="task-list" class="task-list">
        <p class="empty-tip">还没有任务，填写提示词开始生图吧。</p>
      </div>
    </section>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <img id="lightbox-img" alt="生成结果">
      <div class="lightbox-meta">
        <pre id="lightbox-info"></pre>
        <div class="lightbox-actions">
          <a id="lightbox-download" class="primary-btn" download>下载原图</a>
          <button id="lightbox-close" class="ghost-btn" type="button">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
